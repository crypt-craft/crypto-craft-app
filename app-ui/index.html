    <!-- EventEmitter fix script - must be loaded first -->

    <!-- Direct polyfills - no dynamic imports -->
    <script>
      // Simple Buffer polyfill implementation
      function BufferPolyfill(arg, encodingOrOffset, length) {
        // Basic implementation
        if (!(this instanceof BufferPolyfill)) return new BufferPolyfill(arg, encodingOrOffset, length);
        
        this._isBuffer = true;
        this._arr = Array.isArray(arg) ? arg.slice() : 
                   (typeof arg === 'number' ? new Array(arg).fill(0) : 
                   (typeof arg === 'string' ? Array.from(arg).map(c => c.charCodeAt(0)) : []));
      }
      
      BufferPolyfill.prototype.toString = function() {
        return String.fromCharCode.apply(null, this._arr || []);
      };
      
      // Static methods
      BufferPolyfill.isBuffer = function(b) { return !!(b && b._isBuffer); };
      BufferPolyfill.from = function(array, encodingOrOffset, length) {
        return new BufferPolyfill(array, encodingOrOffset, length);
      };
      BufferPolyfill.alloc = function(size, fill, encoding) {
        const buf = new BufferPolyfill(size);
        return buf;
      };
      BufferPolyfill.allocUnsafe = function(size) {
        return new BufferPolyfill(size);
      };
      
      // Ensure Buffer is globally available
      window.Buffer = BufferPolyfill;
      globalThis.Buffer = BufferPolyfill;
      
      // Other polyfills
      window.global = window;
      globalThis.global = window;
      
      // Process polyfill
      window.process = { env: {}, browser: true };
      globalThis.process = window.process;
      
      // BN.js polyfill
      class BN {
        constructor(value, base) {
          this.value = typeof value === 'number' ? String(value) : 
                      typeof value === 'string' ? value :
                      value instanceof BN ? value.value :
                      Array.isArray(value) ? Array.from(value).join('') :
                      '0';
          
          // Handle base conversion for string inputs
          if (typeof value === 'string' && base) {
            try {
              this.value = parseInt(value, base).toString();
            } catch (e) {
              this.value = '0';
            }
          }
        }
        
        toString(base) {
          if (base === 10 || !base) return this.value;
          try {
            return parseInt(this.value).toString(base);
          } catch (e) {
            return '0';
          }
        }
        
        toNumber() {
          try {
            return Number(this.value);
          } catch (e) {
            return 0;
          }
        }
        
        toJSON() {
          return this.value;
        }
      }
      
      BN.isBN = function(obj) {
        return obj instanceof BN;
      };
      
      // Make BN globally available
      window.BN = BN;
      globalThis.BN = BN;
    </script>
