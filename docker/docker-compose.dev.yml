services:
  frontend:
    image: node:24-alpine
    working_dir: /app/app-ui
    volumes:
      - ../app-ui:/app/app-ui
      - /app/app-ui/node_modules
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URI=${VITE_API_URI:-https://app.crypto-craft.local}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1,app.crypto-craft.local,app.crypto-craft.net}
      - VITE_HMR_HOST=${VITE_HMR_HOST:-app.crypto-craft.local}
      - VITE_HMR_CLIENT_PORT=${VITE_HMR_CLIENT_PORT:-443}
      - VITE_HMR_PROTOCOL=${VITE_HMR_PROTOCOL:-wss}
      - VITE_ENABLE_PHANTOM=${VITE_ENABLE_PHANTOM:-true}
      - VITE_ENABLE_TRUST=${VITE_ENABLE_TRUST:-true}
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host"
    env_file:
      - ../app-ui/.env